# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: final_damage_formula
    status: active
    source: design/gdd/combat-system.md
    referenced_by:
      - design/gdd/combat-system.md
      - design/gdd/damage-calculation-system.md
      - design/gdd/martial-arts-system.md
    variables:
      - base_damage
      - crit_multiplier
      - combo_multiplier
      - weakness_multiplier
      - break_multiplier
      - status_multiplier
      - random_variance
      - element_multiplier
    output_range: [5, 3000]
    expression: "base_damage × crit_multiplier × combo_multiplier × weakness_multiplier × break_multiplier × status_multiplier × random_variance × element_multiplier"
    notes: "Complete damage calculation formula including all multipliers. Element multiplier is 1.5× for counter elements, 1.0× otherwise."
    added: "2026-04-28"
    revised: ""

  - name: max_hp_formula
    status: active
    source: design/gdd/health-defense-system.md
    referenced_by:
      - design/gdd/health-defense-system.md
      - design/gdd/character-progression-system.md
    variables:
      - base_hp
      - con_stat
      - hp_coefficient
      - equipment_bonus
    output_range: [100, 2000]
    expression: "base_hp + (con_stat × hp_coefficient) + equipment_bonus"
    notes: "Maximum health points calculation. CON attribute provides +20 HP per point."
    added: "2026-04-28"
    revised: ""

  - name: max_poise_formula
    status: active
    source: design/gdd/health-defense-system.md
    referenced_by:
      - design/gdd/health-defense-system.md
      - design/gdd/combat-system.md
      - design/gdd/character-progression-system.md
    variables:
      - base_poise
      - will_stat
      - poise_coefficient
      - equipment_bonus
    output_range: [50, 800]
    expression: "base_poise + (will_stat × poise_coefficient) + equipment_bonus"
    notes: "Maximum poise/stance calculation. WILL attribute provides +10 poise per point."
    added: "2026-04-28"
    revised: ""

  - name: exp_to_level_formula
    status: active
    source: design/gdd/experience-system.md
    referenced_by:
      - design/gdd/experience-system.md
      - design/gdd/level-up-mechanism.md
    variables:
      - base_value
      - level
      - exponent_coefficient
    output_range: [100, 50000]
    expression: "base_value × (level ^ exponent_coefficient)"
    notes: "Experience required to level up. Uses segmented exponent: early=1.0, mid=1.5, late=2.5"
    added: "2026-04-28"
    revised: ""

