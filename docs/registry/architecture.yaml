# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: game_events_signal_bus
    status: active
    pattern: signal
    producer: game-systems
    consumers:
      - hud-system
      - ui-components
    adr: docs/architecture/adr-003-data-binding-mechanism.md
    signal_signature: "50+ typed signals in GameEvents autoload (player_*, combat_*, enemy_*, buff_*, quest_*, nav_*, item_*, skill_*, system_*)"
    referenced_by:
      - docs/architecture/adr-002-hud-architecture-pattern.md
      - docs/architecture/adr-003-data-binding-mechanism.md
    added: 2026-04-30
    revised: ""
    notes: "All game-to-UI communication must use GameEvents signals. Naming convention: namespace_prefix + verb_past_tense (e.g., player_hp_changed, combat_started)"

