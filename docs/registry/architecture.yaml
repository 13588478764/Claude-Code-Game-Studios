# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: ui_data_binding
    status: active
    api: GameEvents signal bus (Godot autoload singleton)
    not: Direct UI component references or polling in _process()
    adr: docs/architecture/adr-003-data-binding-mechanism.md
    reason: "Signal-driven architecture ensures loose coupling between game logic and UI. Avoids performance overhead of polling and maintains clean separation of concerns."
    referenced_by:
      - docs/architecture/adr-002-hud-architecture-pattern.md
      - docs/architecture/adr-003-data-binding-mechanism.md
    added: 2026-04-30
    revised: ""
  
  - purpose: ui_element_pooling
    status: active
    api: ObjectPool pattern (custom implementation)
    not: Direct instantiate/free for frequently created UI elements
    adr: docs/architecture/adr-004-performance-optimization-strategy.md
    reason: "Object pooling eliminates GC pressure from frequent UI element creation/destruction. Pre-allocates fixed pool size for Buff icons, damage numbers, and notifications."
    referenced_by:
      - docs/architecture/adr-004-performance-optimization-strategy.md
    added: 2026-04-30
    revised: ""
  
  - purpose: ui_batch_updates
    status: active
    api: BatchUpdateManager (custom autoload)
    not: Immediate UI updates on every signal
    adr: docs/architecture/adr-004-performance-optimization-strategy.md
    reason: "Batch update mechanism collects multiple update requests per frame and applies them once, reducing draw calls by 50%+. Merges duplicate updates automatically."
    referenced_by:
      - docs/architecture/adr-004-performance-optimization-strategy.md
    added: 2026-04-30
    revised: ""

