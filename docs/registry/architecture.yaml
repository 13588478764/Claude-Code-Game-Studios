# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: hud-system
    status: active
    budget_ms: 1.0
    context: combat
    adr: docs/architecture/adr-004-performance-optimization-strategy.md
    notes: "HUD update time in combat mode. Includes all UI updates, batch processing, and object pool operations."
    referenced_by:
      - docs/architecture/adr-002-hud-architecture-pattern.md
      - docs/architecture/adr-004-performance-optimization-strategy.md
    added: 2026-04-30
    revised: ""
  
  - system: hud-system
    status: active
    budget_ms: 0.5
    context: exploration
    adr: docs/architecture/adr-004-performance-optimization-strategy.md
    notes: "HUD update time in exploration mode. Lower priority updates use LOD scheduling to reduce frequency."
    referenced_by:
      - docs/architecture/adr-002-hud-architecture-pattern.md
      - docs/architecture/adr-004-performance-optimization-strategy.md
    added: 2026-04-30
    revised: ""

