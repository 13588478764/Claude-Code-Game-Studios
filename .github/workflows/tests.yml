name: Automated Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run GUT Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.6
          use-dotnet: false

      - name: Run Unit Tests
        run: |
          godot --headless --script addons/gut/gut_cmdln.gd -gdir=tests/unit -glog=2
        continue-on-error: false

      - name: Run Integration Tests
        run: |
          godot --headless --script addons/gut/gut_cmdln.gd -gdir=tests/integration -glog=2
        continue-on-error: false

      - name: Generate Test Report
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests completed" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/unit/
            tests/integration/
          retention-days: 30

  coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.6
          use-dotnet: false

      - name: Generate Coverage Report
        run: |
          godot --headless --script addons/gut/gut_cmdln.gd -gdir=tests -gcoverage
        continue-on-error: true

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 30

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GDScript Syntax
        run: |
          echo "Checking GDScript files for syntax errors..."
          find src/scripts -name "*.gd" -type f | head -20
        continue-on-error: true

      - name: Check Test File Naming
        run: |
          echo "Checking test file naming conventions..."
          find tests -name "*_test.gd" -type f | wc -l
        continue-on-error: true

  status:
    name: Test Status Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test]

    steps:
      - name: Check Test Results
        run: |
          echo "## CI/CD Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi