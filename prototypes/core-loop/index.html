.risk-fail { color: #FF6B6B; text-shadow: 0 0 20px rgba(255,107,107,0.6); }

@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes titleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

@keyframes dayZoom { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes resolvePop { 0% { transform: scale(0.5) translateY(10px); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1) translateY(0); opacity: 1; } }
@keyframes warningPulse { 0%,100% { background: linear-gradient(160deg, #1e1b3a 0%, #0f0a26 100%); } 50% { background: linear-gradient(160deg, #3a1b2e 0%, #260a1e 100%); } }

@keyframes diceRoll {
  0% { transform: rotate(0) scale(0.5); opacity: 0; }
  50% { transform: rotate(360deg) scale(1.3); opacity: 1; }
  100% { transform: rotate(720deg) scale(1); opacity: 1; }
}
.crisis-mode { animation: warningPulse 1.2s infinite; }

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function energyColor(v) { return v <= 30 ? '#FF6B6B' : v <= 50 ? '#FFCC00' : '#4CD964'; }
function moodColor(v) { return v <= 20 ? '#9b6bff' : v <= 30 ? '#8E8E93' : '#FF9500'; }
function charFace() {
  if (G.energy <= 20 || G.mood <= 20) return '😵';

  if (G.mood <= 30) return '😠';
  if (G.energy >= 70 && G.mood >= 70) return '😎';
  if (G.mood >= 70) return '😄';
  return '🙂';
}
function charClass() {
  if (G.energy <= 20 || G.mood <= 20) return 'crisis';
  if (G.energy <= 30 || G.mood <= 30) return 'warning';
  return '';
}
function statusTag() {
  if (G.mood <= 20) return '💢';

  if (G.mood >= 80) return '✨';
  return '💼';
}
function rating() {
  var s = (G.money / 100) * 0.5 + (G.energy / 100) * 0.25 + (G.mood / 100) * 0.25;
  if (s >= 0.9) return 'S级 · 卷王之王';
  if (s >= 0.7) return 'A级 · 打工达人';
  if (s >= 0.5) return 'B级 · 勉强混过';
  if (s >= 0.3) return 'C级 · 摸鱼被抓';
  return 'D级 · 差点寄了';
}
function playTime() { return Math.round((Date.now() - G.startTime) / 1000); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Apply status modifiers to a delta value
function modifyDelta(target, baseValue) {
  var mul = 1.0;
  for (var i = 0; i < G.statuses.length; i++) {
    var s = G.statuses[i];
    var key = target + 'Mul';
    if (s[key] != null) {
      // For negative deltas: buff reduces magnitude (mul<1), debuff increases (mul>1)
      // For positive deltas: buff increases (mul>1)?  → keep simple: status mul applies to magnitude
      if (s.type === 'buff' && baseValue < 0) {
        mul *= s[key];  // reduce damage
      } else if (s.type === 'debuff' && baseValue < 0) {
        mul *= s[key];  // amplify damage
      } else if (s.type === 'buff' && baseValue > 0 && s[key] < 1) {
        // For "回血" type buff that boosts recovery, invert
        mul *= (2 - s[key]);  // 0.7 → 1.3 boost
      }
    }
  }
  return Math.round(baseValue * mul);
}

function tickStatuses() {
  var next = [];
  for (var i = 0; i < G.statuses.length; i++) {
    var s = G.statuses[i];
    s.days--;
    if (s.days > 0) next.push(s);
  }
  G.statuses = next;
}

function addStatus(buff) {
  // Replace existing same-name status, or add new
  for (var i = 0; i < G.statuses.length; i++) {
    if (G.statuses[i].name === buff.name) {
      G.statuses[i] = Object.assign({}, buff);
      return;
    }
  }
  G.statuses.push(Object.assign({}, buff));
}

function drawEvent() {
  if (G.queuedCard) {
    var c = G.queuedCard;
    G.queuedCard = null;
    return c;
  }
  var avail = [];
  for (var i = 0; i < EVENTS.length; i++) if (!G.used[i]) avail.push(i);
  if (avail.length === 0) { G.used = {}; return drawEvent(); }
  var pick = avail[Math.floor(Math.random() * avail.length)];
  G.used[pick] = true;
  return EVENTS[pick];
}

function showResolve(text, type) {
  var el = document.getElementById('resolve');
  if (el) el.innerHTML = '<span class="resolve-tag delta-' + type + '">' + text + '</span>';
}

function showTransition(cb) {

}

function showRiskRoll(success, resultText, cb) {
  var div = document.createElement('div');
  div.className = 'risk-overlay';
  div.innerHTML =
    '<div class="dice">🎲</div>' +
    '<div class="risk-result-text ' + (success ? 'risk-success' : 'risk-fail') + '">' +
      (success ? '✨ 成功' : '💀 翻车') + '</div>' +
    '<div class="risk-detail">' + escHtml(resultText) + '</div>';
  document.getElementById('app').appendChild(div);
  setTimeout(function() {
    if (div.parentNode) div.parentNode.removeChild(div);
    cb();
  }, 2000);
}

function startDay() {
  G.total = EVENTS_PER_DAY[G.day - 1];
  G.done = 0;
  render();
  showTransition(function() {
    G.card = drawEvent();
    render();
  });
}

function applyEffects(fx, prefix) {
  var deltas = [];
  for (var i = 0; i < fx.length; i++) {
    var f = fx[i];
    var raw = f.v;
    var modded = (f.t === 'energy' || f.t === 'mood') ? modifyDelta(f.t, raw) : raw;
    var before, after;
    if (f.t === 'energy') { before = G.energy; G.energy = clamp(G.energy + modded, 0, 100); after = G.energy; }
    else if (f.t === 'mood') { before = G.mood; G.mood = clamp(G.mood + modded, 0, 100); after = G.mood; }
    else { before = G.money; G.money += modded; after = G.money; }
    var d = after - before;
    if (d !== 0) {
      var icon = f.t === 'energy' ? '⚡' : f.t === 'mood' ? '😊' : '💰';
      var marker = (modded !== raw) ? '*' : '';
      deltas.push(icon + ' ' + (d > 0 ? '+' : '') + d + marker);
    }
  }
  return deltas;
}

window.doStart = function() {
  G.started = true;
  G.startTime = Date.now();
  startDay();
};

window.doBuy = function(itemId) {
  if (G.resolving) return;
  var item = null;
  for (var i = 0; i < SHOP.length; i++) if (SHOP[i].id === itemId) { item = SHOP[i]; break; }
  if (!item || G.money < item.cost) return;
  G.money -= item.cost;
  var deltas = applyEffects(item.fx);
  deltas.unshift('💰 -' + item.cost);
  showResolve(item.icon + ' ' + item.name + '   ' + deltas.join('  '), 'positive');
  render();
  setTimeout(function() {
    var el = document.getElementById('resolve');
    if (el) el.innerHTML = '';
  }, 1200);
};

function processChoiceOutcome(choiceObj, cb) {
  // Apply fx
  var deltas = applyEffects(choiceObj.fx || []);
  var resolveType = 'neutral';
  for (var j = 0; j < deltas.length; j++) {
    if (deltas[j].indexOf('-') > -1) { resolveType = 'negative'; break; }
    if (deltas[j].indexOf('+') > -1) resolveType = 'positive';
  }

  // Apply buff
  if (choiceObj.buff) {
    addStatus(choiceObj.buff);
  }

  render();
  if (deltas.length) showResolve(deltas.join('   '), resolveType);

  // Queue followUp
  if (choiceObj.followUp) {
    G.queuedCard = Object.assign({}, choiceObj.followUp, { _isFollowUp: true });
  }

  setTimeout(cb, 1100);
}

window.doChoice = function(which) {
  if (G.resolving || G.dead || G.win || !G.card) return;
  G.resolving = true;
  G.choices++;

  var sel = which === 'a' ? G.card.a : G.card.b;

  // Risk path
  if (sel.risk) {
    render();
    var roll = Math.random();
    var success = roll < sel.risk.chance;
    var outcome = success ? sel.risk.success : sel.risk.fail;

    showRiskRoll(success, outcome.text, function() {
      processChoiceOutcome(outcome, finishCard);
    });
    return;
  }

  render();
  processChoiceOutcome(sel, finishCard);
};

function finishCard() {
  if (G.energy <= 0) {
    G.dead = true;
    G.deathTitle = '燃尽了';
    G.deathReason = '你的身体终于扛不住了…老板说会在群里默哀三秒';
    render(); return;
  }
  if (G.mood <= 0) {
    G.dead = true;
    G.deathTitle = '暴走离职';
    G.deathReason = '你把辞职信摔在桌上 头也不回地走了 解放了';
    render(); return;
  }

  G.resolving = false;
  G.done++;

  if (G.done >= G.total) {
    var salary = DAY_SALARY[G.day - 1];
    G.money += salary;
    tickStatuses();
    render();
    showResolve('💰 +' + salary + ' 日薪到账', 'positive');

    setTimeout(function() {
      if (G.day >= 5) { G.win = true; render(); }
      else { G.day++; startDay(); }
    }, 1200);
  } else {
    G.card = drawEvent();
    render();
  }
}

window.doRestart = function() {
  G.energy = 80; G.mood = 60; G.money = 0;
  G.day = 1; G.done = 0; G.dead = false; G.win = false;
  G.resolving = false; G.choices = 0; G.used = {};
  G.statuses = []; G.queuedCard = null;
